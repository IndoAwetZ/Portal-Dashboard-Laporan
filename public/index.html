<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Monitoring Pelaporan Prognas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-hospital-user text-2xl"></i>
        <div>
          <h1 class="text-xl font-bold leading-tight">Portal Pelaporan Program Nasional (Prognas)</h1>
          <p class="text-xs text-indigo-200">Monitoring & Akses Satu Pintu Pelaporan Kemenkes RI</p>
        </div>
      </div>
      <div class="text-right">
        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-indigo-900 text-indigo-100">
          <i class="fa-regular fa-calendar-days mr-1.5"></i> <span id="currentPeriodDisplay">Agustus 2026</span>
        </span>
      </div>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    
    <!-- Baris Ringkasan -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Total Laporan</p>
          <p class="text-2xl font-bold text-slate-800" id="totalCount">-</p>
        </div>
        <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-lg flex items-center justify-center">
          <i class="fa-solid fa-list-check"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-emerald-600 uppercase tracking-wider">Sudah Dilaporkan</p>
          <p class="text-2xl font-bold text-emerald-600" id="doneCount">-</p>
        </div>
        <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center">
          <i class="fa-solid fa-circle-check"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-rose-600 uppercase tracking-wider">Belum Dilaporkan</p>
          <p class="text-2xl font-bold text-rose-600" id="pendingCount">-</p>
        </div>
        <div class="w-10 h-10 bg-rose-50 text-rose-600 rounded-lg flex items-center justify-center">
          <i class="fa-solid fa-circle-exclamation"></i>
        </div>
      </div>
    </div>

    <!-- Grid Daftar Laporan -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="cardContainer">
      <div class="col-span-full text-center py-16 text-slate-500">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-indigo-600"></i>
        <p class="text-sm">Menghubungkan data ke Cloudflare D1...</p>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
    Portal Monitoring Internal Faskes &copy; 2026
  </footer>

  <script>
    // URL Backend Cloudflare Worker Anda (Pastikan tanpa trailing slash '/')
    const API_BASE_URL = 'https://portal-pelaporan.jr-pro-and-co.workers.dev';

    // Set Label Bulan Berjalan
    const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
    const d = new Date();
    document.getElementById('currentPeriodDisplay').innerText = months[d.getMonth()] + " " + d.getFullYear();

    // Fetch dan Tampilkan Data dari Worker
    async function loadReports() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/reports`);
        const data = await res.json();

        let total = data.length;
        let done = data.filter(r => r.status === 'SUDAH').length;
        let pending = total - done;

        document.getElementById('totalCount').innerText = total;
        document.getElementById('doneCount').innerText = done;
        document.getElementById('pendingCount').innerText = pending;

        const container = document.getElementById('cardContainer');
        container.innerHTML = '';

        data.forEach(r => {
          const isSudah = r.status === 'SUDAH';
          const badgeClass = isSudah ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : 'bg-rose-100 text-rose-700 border-rose-200';
          const badgeIcon = isSudah ? 'fa-check' : 'fa-xmark';
          const badgeText = isSudah ? 'Sudah Lapor' : 'Belum Lapor';
          const btnStatusText = isSudah ? 'Tandai Belum' : 'Tandai Selesai';
          const btnStatusClass = isSudah ? 'text-amber-600 hover:text-amber-700 bg-amber-50 hover:bg-amber-100 border-amber-200' : 'text-emerald-700 hover:text-emerald-800 bg-emerald-50 hover:bg-emerald-100 border-emerald-200';

          const card = `
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
              <div class="p-5">
                <div class="flex items-start justify-between mb-3">
                  <div>
                    <span class="text-[10px] font-bold tracking-wider uppercase px-2 py-0.5 rounded bg-slate-100 text-slate-600 border border-slate-200">${r.category}</span>
                    <h3 class="text-lg font-bold text-slate-800 mt-1.5 leading-tight">${r.name}</h3>
                  </div>
                  <span class="inline-flex items-center px-2 py-1 rounded text-[11px] font-semibold border ${badgeClass}">
                    <i class="fa-solid ${badgeIcon} mr-1"></i> ${badgeText}
                  </span>
                </div>
                <p class="text-[13px] text-slate-500 mb-4 line-clamp-2">${r.description}</p>
                <div class="text-[12px] text-slate-500 space-y-1.5 border-t border-slate-100 pt-3">
                  <div class="flex justify-between"><span>PIC:</span> <strong class="text-slate-700">${r.pic}</strong></div>
                  <div class="flex justify-between"><span>Tenggat:</span> <strong class="text-rose-600">Tanggal ${r.deadline_day}</strong></div>
                  <div class="flex justify-between"><span>Terakhir Diperiksa:</span> <span class="text-slate-400 italic">${r.last_checked || '-'}</span></div>
                </div>
              </div>
              <div class="bg-slate-50 border-t border-slate-100 p-3 grid grid-cols-2 gap-2">
                <!-- Ganti parameter pemanggilan menjadi (url, id) -->
                <button onclick="openPrognasWindow('${r.portal_url}', '${r.id}')" class="flex items-center justify-center w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded transition shadow-sm">
                  Buka Portal <i class="fa-solid fa-arrow-up-right-from-square ml-2"></i>
                </button>
                <!-- Toggle Checklist Status -->
                <button onclick="toggleStatus('${r.id}')" class="flex items-center justify-center w-full py-2 border ${btnStatusClass} text-xs font-semibold rounded transition shadow-sm">
                  ${btnStatusText} <i class="fa-solid fa-check-double ml-2"></i>
                </button>
              </div>
            </div>
          `;
          container.innerHTML += card;
        });
      } catch (err) {
        document.getElementById('cardContainer').innerHTML = `
          <div class="col-span-full text-center py-12 text-rose-500">
            <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
            <p class="font-semibold">Gagal memuat data dari Cloudflare Worker.</p>
          </div>`;
      }
    }

    // Object untuk mencatat jendela yang sedang aktif
    const activeWindows = {};

    function openPrognasWindow(url, id) {
      // Cek apakah jendela untuk portal ini sudah pernah dibuka dan belum ditutup
      if (activeWindows[id] && !activeWindows[id].closed) {
        activeWindows[id].focus(); // Bawa jendela yang sudah ada ke paling depan
        return;
      }

      // Tentukan ukuran jendela kerja khusus
      const width = Math.min(1280, window.screen.width * 0.9);
      const height = Math.min(850, window.screen.height * 0.85);
      const left = (window.screen.width - width) / 2;
      const top = (window.screen.height - height) / 2;

      const features = [
        `width=${width}`,
        `height=${height}`,
        `top=${top}`,
        `left=${left}`,
        'status=yes',
        'toolbar=no',
        'menubar=no',
        'location=yes',
        'resizable=yes',
        'scrollbars=yes'
      ].join(',');

      // Berikan window name statis berdasarkan ID laporan (misal: PrognasWindow_mpdn)
      const windowName = `PrognasWindow_${id}`;
      
      // Buka dan simpan referensi instance jendela
      activeWindows[id] = window.open(url, windowName, features);

      if (activeWindows[id]) {
        activeWindows[id].focus();
      }
    }

    document.addEventListener('DOMContentLoaded', loadReports);
  </script>
</body>
</html>
